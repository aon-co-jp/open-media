# 最新の .md(README・CLAUDE・PORTING・POLICY など、最上位の *.md すべて)を、
# ソースの版やタグとは別に、いつも `docs` ブランチの一番上の階層へ写す。
# 書き込みが無い日でも毎日3回(日本時間の朝10時・昼12時・夜22時ごろ)走り、リリース公開・手動実行でも走る。
# Mirrors every top-level *.md into the `docs` branch root, always latest,
# independent of source versions and tags. Also runs weekly even without edits.
name: docs-latest
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  schedule:
    - cron: '7 1,3,13 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: docs-latest
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Collect top-level markdown
        run: |
          mkdir -p "$RUNNER_TEMP/docs"
          shopt -s nullglob nocaseglob
          n=0
          for f in *.md; do cp "$f" "$RUNNER_TEMP/docs/"; n=$((n+1)); done
          echo "found $n markdown file(s)"
          [ "$n" -gt 0 ] || echo "::warning::no top-level .md found"
          for f in "$RUNNER_TEMP"/docs/*.md; do
            [ -s "$f" ] || echo "::warning::$(basename "$f") is empty"
            iconv -f UTF-8 -t UTF-8 "$f" >/dev/null 2>&1 || echo "::warning::$(basename "$f") is not valid UTF-8"
          done
          printf 'source: %s\ncommit: %s\nupdated: %s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > "$RUNNER_TEMP/docs/.docs-source.txt"
      - name: Index newest translations (top of docs)
        run: |
          # 日本語以外の言語は毎回は翻訳しない。翻訳済みの範囲の最新版を、いつも一番上(0-LATEST-TRANSLATIONS.md と実行サマリーの先頭)に示す。
          # Other languages are not translated every time; always show the newest translated range at the very top.
          cat > "$RUNNER_TEMP/translations-latest.py" <<'PYEOF'
          #!/usr/bin/env python3
          """docs/ 内の *.md から、日本語以外の言語の「翻訳されている範囲の最新版」を拾い、
          0-LATEST-TRANSLATIONS.md(docs ブランチの一番上に並ぶ名前)を作る。
          Scans *.md in the given dir and builds 0-LATEST-TRANSLATIONS.md listing, per document and
          language, the newest translated section found (even if older than the newest ja/en edit)."""
          import re, sys, os, glob
          d = sys.argv[1]
          LANGS = [  # (code, 表示名, 見出しに含まれる語)
           ("en","English",["English"]),("zh-Hans","简体中文",["简体中文","Simplified"]),
           ("zh-Hant","繁體中文",["繁體中文","Traditional"]),("ko","한국어",["한국어"]),
           ("de","Deutsch",["Deutsch","German"]),("fr","Français",["Français","French"]),
           ("es","Español",["Español","Spanish"]),("pt","Português",["Português","Portuguese"]),
           ("ru","Русский",["Русский","Russian"]),("ar","العربية",["العربية","Arabic"]),
           ("fa","فارسی",["فارسی","Persian"])]
          SUFFIX = {"German":"de","French":"fr","Spanish":"es","Portuguese":"pt","Russian":"ru","Arabic":"ar",
           "Persian":"fa","Korean":"ko","Chinese":"zh-Hans","English":"en","Japanese":"ja"}
          DIG = str.maketrans("۰۱۲۳۴۵۶۷۸۹٠١٢٣٤٥٦٧٨٩", "01234567890123456789")
          dated = re.compile(r"^##\s+(\d{4}-\d{2}-\d{2})")
          head = re.compile(r"^#{3,4}\s+(.*)")
          rows = []
          for f in sorted(glob.glob(os.path.join(d, "*.md"))):
              name = os.path.basename(f)
              if name.startswith("0-LATEST") or name == "INSTALLERS.md": continue
              cur = ""; ja = ""; best = {}
              for line in open(f, encoding="utf-8", errors="replace"):
                  line = line.translate(DIG)
                  m = dated.match(line)
                  if m:
                      cur = m.group(1); ja = max(ja, cur); continue
                  h = head.match(line)
                  if h and cur:
                      t = h.group(1)
                      for code, _, keys in LANGS:
                          if any(k in t for k in keys): best[code] = max(best.get(code, ""), cur)
              m = re.match(r".*?-(\w+)\.md$", name)
              if m and m.group(1) in SUFFIX:
                  best.setdefault(SUFFIX[m.group(1)], "(file)")
              if best or ja: rows.append((name, ja, best))
          out = ["# Latest translations / 翻訳されている範囲の最新版", "",
           "日本語・英語が常に最新の版です。ほかの言語は毎回は翻訳せず、翻訳済みの範囲の最新版を下に示します(最新の編集より古いことがあります。AI翻訳・ネイティブ確認前)。",
           "Japanese and English are always the newest. Other languages are not translated every time; this lists the newest translated section found (it may lag behind the latest edit; AI-translated, not yet native-checked).", ""]
          for name, ja, best in rows:
              out += [f"## {name}", "", f"- 日本語 / ja: {ja or '-'} (latest)"]
              for code, label, _ in LANGS:
                  v = best.get(code)
                  out.append(f"- {label} / {code}: {v if v else 'not yet / まだ'}" + ("" if not v or v==ja else f" (older than {ja})" if ja and v!="(file)" else ""))
              out.append("")
          open(os.path.join(d, "0-LATEST-TRANSLATIONS.md"), "w", encoding="utf-8").write("\n".join(out))
          print("\n".join(out))

          PYEOF
          python3 "$RUNNER_TEMP/translations-latest.py" "$RUNNER_TEMP/docs" > "$RUNNER_TEMP/tl.md"
          cat "$RUNNER_TEMP/tl.md" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/docs/README.md" ]; then
            { echo '> Latest translations / 翻訳の最新版: [0-LATEST-TRANSLATIONS.md](0-LATEST-TRANSLATIONS.md)'; echo; cat "$RUNNER_TEMP/docs/README.md"; } > "$RUNNER_TEMP/r.md"
            mv "$RUNNER_TEMP/r.md" "$RUNNER_TEMP/docs/README.md"
          fi
      - name: List latest installers for every OS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 最新リリース(下書き・先行版を除く)の添付を、OSごとに INSTALLERS.md へ並べる。ソースの版とは別。
          # Lists the newest stable release's assets per OS in INSTALLERS.md, apart from source versions.
          out="$RUNNER_TEMP/docs/INSTALLERS.md"
          rel=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" 2>/dev/null || true)
          {
            echo "# Latest installers / 最新のインストーラー"
            echo
            if [ -z "$rel" ] || [ "$(echo "$rel" | jq -r '.tag_name // empty')" = "" ]; then
              echo "No release yet. / まだリリースはありません。"
            else
              echo "Version / 版: \`$(echo "$rel" | jq -r .tag_name)\` ($(echo "$rel" | jq -r '.published_at[:10]')) - $(echo "$rel" | jq -r .html_url)"
              echo
              for os in "Windows|exe msi" "macOS|dmg pkg" "Linux|deb rpm AppImage appimage tar.gz tgz" "Android|apk aab" "iOS|ipa" "Other / その他|zip"; do
                name="${os%%|*}"; exts="${os#*|}"
                rows=""
                for e in $exts; do
                  rows="$rows$(echo "$rel" | jq -r --arg e ".$e" '.assets[] | select(.name|ascii_downcase|endswith($e)) | "| [\(.name)](\(.browser_download_url)) | \(.size/1048576*10|floor/10) MB | \((.digest // "-")|sub("^sha256:";"")) |"')"$'\n'
                done
                rows=$(printf '%s' "$rows" | sed '/^$/d' | sort -u)
                if [ -n "$rows" ]; then
                  echo "## $name"; echo
                  echo "| File | Size | SHA-256 |"; echo "|---|---|---|"
                  echo "$rows"; echo
                fi
              done
              echo "_Unsigned builds may show an OS warning. / 署名のないものは、OSが警告を出すことがあります。_"
            fi
          } > "$out"
          cat "$out" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to docs branch
        run: |
          git config user.name "docs-latest[bot]"
          git config user.email "docs-latest@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin docs >/dev/null 2>&1; then
            git fetch --depth 1 origin docs
            git checkout -B docs FETCH_HEAD
          else
            git checkout --orphan docs
          fi
          git rm -rfq . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP"/docs/. .
          git add -A
          # 日時だけの差では新しいコミットを作らない / skip commits that differ only by the timestamp
          if git diff --cached --quiet -- . ':!.docs-source.txt'; then
            echo "no content change"; exit 0
          fi
          git commit -qm "docs: sync top-level markdown from ${GITHUB_SHA::7}"
          git push origin docs
