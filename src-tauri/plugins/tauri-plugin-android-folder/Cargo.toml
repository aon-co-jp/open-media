[package]
name = "tauri-plugin-android-folder"
version = "0.1.0"
edition = "2021"
description = "Android SAF (ACTION_OPEN_DOCUMENT_TREE) folder picker, for platforms/plugin versions where the stock dialog plugin does not implement folder picking on mobile."
license = "MIT"
links = "tauri-plugin-android-folder"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
