[package]
name = "make-disk-installer"
# 注意: このCargo.toml自体のバージョンは表示に使わない(build.rsが../package.jsonから
# 埋め込んだmake-disk本体のバージョンを読み、DisplayVersion/ウィンドウタイトルへ使う)。
# ここは新規リリースのたびに手動で追従させる必要がなくなったが、`cargo publish`等の
# 慣習に合わせて一応make-disk本体と揃えておく。
version = "0.1.31"
edition = "2021"
description = "make-disk を1クリックでインストールする自己完結インストーラー(ffmpeg/xorriso/rs-ffmpeg/rs-xorriso同梱、open-barは任意で最新版を実行時取得)。"

[[bin]]
name = "make-disk-installer"
path = "src/main.rs"

[dependencies]
native-windows-gui = { version = "1.0.13", features = ["file-dialog"] }
native-windows-derive = "1.0.5"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
winreg = "0.52"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[build-dependencies]
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
strip = true

[package.metadata.winres]
OriginalFilename = "make-disk-installer.exe"
ProductName = "make-disk installer"
