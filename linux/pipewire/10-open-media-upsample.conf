# open-media: PipeWire の全アプリ音声を高品質にアップサンプリングして出力する設定。
# 置き場所: ~/.config/pipewire/pipewire.conf.d/10-open-media-upsample.conf
# 反映: systemctl --user restart pipewire pipewire-pulse wireplumber
#
# default.clock.rate に近い高いレートでデバイスを動かし、各アプリの音(44.1/48 kHzなど)は
# PipeWire の変換器(resample.quality 0〜14、最高14)で変換されます。
# DACが受け付けないレートを指定すると無音や音切れになるため、DACの対応レートに合わせて
# allowed-rates / rate を編集してください(例: 対応が最大192 kHzなら 352800/384000 を外す)。
context.properties = {
    default.clock.rate          = 192000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 352800 384000 ]
}

stream.properties = {
    resample.quality = 14
}
